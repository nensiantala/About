<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Login Page</title>
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6">
                <h3>Login</h3>
                <form>
                    <div class="form-group">
                        <label for="loginEmail">Email address:</label>
                        <input type="email" class="form-control" id="loginEmail" placeholder="Enter email">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password:</label>
                        <input type="password" class="form-control" id="loginPassword" placeholder="Enter password">
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <p class="mt-3">Don't have an account? <a href="#signUp">Sign Up</a></p>
            </div>
            <div class="col-md-6" id="signUp">
                <h3>Sign Up</h3>
                <form>
                    <div class="form-group">
                        <label for="signUpName">Name:</label>
                        <input type="text" class="form-control" id="signUpName" placeholder="Enter name">
                    </div>
                    <div class="form-group">
                        <label for="signUpEmail">Email address:</label>
                        <input type="email" class="form-control" id="signUpEmail" placeholder="Enter email">
                    </div>
                    <div class="form-group">
                        <label for="signUpPassword">Password:</label>
                        <input type="password" class="form-control" id="signUpPassword" placeholder="Enter password">
                    </div>
                    <button type="submit" class="btn btn-primary">Sign Up</button>
                </form>
                <p class="mt-3">Already have an account? <a href="#login">Login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
